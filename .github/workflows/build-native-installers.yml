name: Build Native Installers (Windows, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Hosted Neuron Mind backend URL"
        required: true
        default: "https://ais-pre-3cysbecvm4thgw3c4bg56j-545566137884.europe-west2.run.app"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI & Build MSI/EXE
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          npm ci
          npm install -D @tauri-apps/cli
          npx tauri icon public/pwa-512x512.png
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-mind-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android APK & AAB
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          npm ci
          npm install @capacitor/core @capacitor/app @capacitor/haptics @capacitor/keyboard @capacitor/local-notifications @capacitor/network @capacitor/preferences @capacitor/push-notifications @capacitor/share @capacitor/filesystem @capacitor/splash-screen @capacitor/status-bar
          npm install -D @capacitor/cli @capacitor/android
          npm run build
          npx cap add android
          npx cap sync android
          cd android && ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-mind-android-packages
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Unsigned iOS Archive
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          npm ci
          npm install @capacitor/core @capacitor/app @capacitor/haptics @capacitor/keyboard @capacitor/local-notifications @capacitor/network @capacitor/preferences @capacitor/push-notifications @capacitor/share @capacitor/filesystem @capacitor/splash-screen @capacitor/status-bar
          npm install -D @capacitor/cli @capacitor/ios
          npm run build
          npx cap add ios
          npx cap sync ios
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/NeuronMind.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-mind-ios-xcarchive
          path: build/NeuronMind.xcarchive
